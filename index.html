<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Star Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle, #2c0e38, #11021b);
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin-bottom: 15px;
            color: #ff7eb3;
            text-shadow: 0 4px 15px rgba(255, 126, 179, 0.4);
        }

        .info-panel {
            display: flex;
            gap: 25px;
            font-size: 1.3rem;
            margin-bottom: 35px;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(3, 90px);
            gap: 15px;
            margin-bottom: 30px;
        }

        .cell {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ff7eb3;
            transform: scale(1.05);
        }

        .star {
            animation: popIn 0.2s ease-in-out;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn {
            background: linear-gradient(45deg, #ff758c, #ff7eb3);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 117, 140, 0.6);
        }

        .message-box {
            font-size: 1.8rem;
            color: #ff7eb3;
            text-align: center;
            display: none;
            animation: fadeIn 0.8s ease-in-out;
            background: rgba(255, 117, 140, 0.1);
            padding: 15px 30px;
            border-radius: 20px;
            border: 1px solid rgba(255, 117, 140, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1>🌟 Catch the Star Game</h1>
    
    <div class="info-panel">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="timer">30</span>s</div>
    </div>

    <div class="grid" id="game-grid">
        <div class="cell" onclick="checkClick(0)"></div>
        <div class="cell" onclick="checkClick(1)"></div>
        <div class="cell" onclick="checkClick(2)"></div>
        <div class="cell" onclick="checkClick(3)"></div>
        <div class="cell" onclick="checkClick(4)"></div>
        <div class="cell" onclick="checkClick(5)"></div>
        <div class="cell" onclick="checkClick(6)"></div>
        <div class="cell" onclick="checkClick(7)"></div>
        <div class="cell" onclick="checkClick(8)"></div>
    </div>

    <button class="btn" id="start-btn" onclick="startGame()">Start Game</button>
    
    <div class="message-box" id="result-message">Game Over! Score: <span id="final-score">0</span></div>

    <script>
        const cells = document.querySelectorAll('.cell');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const resultMessage = document.getElementById('result-message');
        const finalScore = document.getElementById('final-score');
        
        let score = 0;
        let time = 30;
        let activeCell = null;
        let timerInterval = null;
        let gameActive = false;
        let starTimeout = null;

        // Audio Effect ke liye
        function playSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.15);
        }

        function startGame() {
            score = 0;
            time = 30;
            gameActive = true;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = time;
            startBtn.style.display = 'none';
            resultMessage.style.display = 'none';
            
            // Grid ko saaf karein
            cells.forEach(cell => cell.textContent = '');

            // Star spawn karein
            spawnStar();

            // Timer
            timerInterval = setInterval(() => {
                time--;
                timerDisplay.textContent = time;

                if (time <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function spawnStar() {
            if (!gameActive) return;

            // Purane star ko hata dein
            if (activeCell !== null) {
                cells[activeCell].textContent = '';
            }

            // Naya cell chunein
            activeCell = Math.floor(Math.random() * 9);
            cells[activeCell].textContent = '⭐';
            cells[activeCell].classList.add('star');

            // Agar click nahi hua toh star 1 second me move ho jayega
            clearTimeout(starTimeout);
            starTimeout = setTimeout(() => {
                if (gameActive) {
                    spawnStar();
                }
            }, 1000);
        }

        function checkClick(index) {
            if (!gameActive) return;

            if (index === activeCell) {
                score++;
                scoreDisplay.textContent = score;
                playSound();

                // Naya star turant generate karein
                cells[activeCell].textContent = '';
                clearTimeout(starTimeout);
                spawnStar();
            }
        }

        function endGame() {
            gameActive = false;
            clearInterval(timerInterval);
            clearTimeout(starTimeout);

            if (activeCell !== null) {
                cells[activeCell].textContent = '';
            }

            resultMessage.style.display = 'block';
            finalScore.textContent = score;
            startBtn.textContent = 'Restart Game';
            startBtn.style.display = 'block';
        }
    </script>
</body>
</html>
